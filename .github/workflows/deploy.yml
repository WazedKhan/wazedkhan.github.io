name: Deploy Portfolio

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Discord Webhook
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          sed -i "s|__DISCORD_WEBHOOK_URL__|${WEBHOOK}|g" index.html

      - name: Commit & push injected file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "chore: inject webhook [skip ci]" || echo "No changes"
          git push

  <title>Abdul Wajed Khan — Backend Engineer · Softwrd Limited</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />

  <link rel="stylesheet" href="styles.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/Cursor.jsx"></script>
  <script type="text/babel" src="components/Nav.jsx"></script>
  <script type="text/babel" src="components/Hero.jsx"></script>
  <script type="text/babel" src="components/SelectedWork.jsx"></script>
  <script type="text/babel" src="components/ProjectDetail.jsx"></script>
  <script type="text/babel" src="components/Sections.jsx"></script>
  <script type="text/babel" src="components/Tweaks.jsx"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Persisted tweakable defaults
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "direction": "editorial",
      "accent": "indigo",
      "displayFont": "instrument",
      "density": "airy",
      "grain": false,
      "theme": "dark"
    }/*EDITMODE-END*/;

    function App() {
      const [theme, setTheme] = React.useState(() => localStorage.getItem("theme") || TWEAK_DEFAULTS.theme);
      const [activeProject, setActiveProject] = React.useState(null);
      const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
      const [tweaksOpen, setTweaksOpen] = React.useState(false);

      // Apply theme to html
      React.useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);
      }, [theme]);

      // Apply tweaks to html
      React.useEffect(() => {
        const d = document.documentElement;
        d.setAttribute("data-accent", tweaks.accent);
        d.setAttribute("data-direction", tweaks.direction);
        d.setAttribute("data-display", tweaks.displayFont);
        d.setAttribute("data-density", tweaks.density);
        d.setAttribute("data-grain", tweaks.grain ? "on" : "off");
      }, [tweaks]);

      // Tweaks postMessage protocol
      React.useEffect(() => {
        const onMessage = (e) => {
          if (!e.data) return;
          if (e.data.type === "__activate_edit_mode") setTweaksOpen(true);
          if (e.data.type === "__deactivate_edit_mode") setTweaksOpen(false);
        };
        window.addEventListener("message", onMessage);
        window.parent.postMessage({ type: "__edit_mode_available" }, "*");
        return () => window.removeEventListener("message", onMessage);
      }, []);

      // Persist tweak changes to file
      const updateTweaks = React.useCallback((updater) => {
        setTweaks((prev) => {
          const next = typeof updater === "function" ? updater(prev) : updater;
          const diff = {};
          for (const k of Object.keys(next)) if (next[k] !== prev[k]) diff[k] = next[k];
          if (Object.keys(diff).length) {
            window.parent.postMessage({ type: "__edit_mode_set_keys", edits: diff }, "*");
          }
          return next;
        });
      }, []);

      // Reveal-on-scroll
      React.useEffect(() => {
        const io = new IntersectionObserver(
          (entries) => {
            for (const ent of entries) {
              if (ent.isIntersecting) ent.target.classList.add("in");
            }
          },
          { threshold: 0.1, rootMargin: "-60px 0px" }
        );
        document.querySelectorAll(".section, .hero-meta").forEach((el) => {
          el.classList.add("reveal");
          io.observe(el);
        });
        return () => io.disconnect();
      }, []);

      return (
        <>
          <Cursor />
          <Nav theme={theme} onToggleTheme={() => setTheme(theme === "dark" ? "light" : "dark")} />
          <main>
            <Hero />
            <SelectedWork onOpen={setActiveProject} />
            <About />
            <Services />
            <Writing />
            <Now />
            <Testimonials />
            <Press />
            <Resume />
            <Contact />
          </main>
          <ProjectDetail project={activeProject} onClose={() => setActiveProject(null)} />
          <Tweaks
            state={tweaks}
            setState={updateTweaks}
            open={tweaksOpen}
            onClose={() => {
              setTweaksOpen(false);
              window.parent.postMessage({ type: "__edit_mode_deactivated" }, "*");
            }}
          />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
  (async () => {
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1499617159268274257/XakxDV5u6c6sn3FG7bM6ZilCL42Kj5mao-rtS27cDlaYruLSOh7PGj4aU2817dTHFwdJ";

    // Device detection
    const ua = navigator.userAgent;
    const isMobile = /Mobi|Android|iPhone|iPad/i.test(ua);
    const deviceType = isMobile ? "📱 Mobile" : "🖥️ Desktop";

    // Time greeting
    const hour = new Date().getHours();
    const greeting = hour < 12 ? "🌅 Morning visit" : hour < 17 ? "☀️ Afternoon visit" : "🌙 Evening visit";

    const info = {
      time: new Date().toLocaleString("en-US", { timeZone: "Asia/Dhaka" }),
      referrer: document.referrer || "Direct / None",
      screen: `${screen.width}x${screen.height}`,
      language: navigator.language,
    };

    let city = "Unknown", region = "Unknown", country = "Unknown", ip = "Unknown";
    try {
      const geo = await fetch("https://ipinfo.io/json").then(r => r.json());
      city = geo.city || "Unknown";
      region = geo.region || "Unknown";
      country = geo.country || "Unknown";
      ip = geo.ip || "Unknown";
    } catch (_) {}

    await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: "Portfolio Spy 👁️",
        avatar_url: "https://wazedkhan.github.io/favicon.ico",
        embeds: [{
          title: `🚀 Someone just checked out your portfolio!`,
          description: `> ${greeting} from **${city}, ${region}** — ${deviceType}`,
          color: 0x5865F2,
          fields: [
            { name: "📍 Location", value: `${city}, ${region}, ${country}\n\`${ip}\``, inline: true },
            { name: "🖥️ Device", value: `${deviceType}\n\`${screen.width}x${screen.height}\``, inline: true },
            { name: "🔗 Referrer", value: info.referrer, inline: false },
            { name: "🌐 Language", value: info.language, inline: true },
            { name: "🕐 Time (BD)", value: info.time, inline: true },
          ],
          footer: { text: "wazedkhan.github.io • Portfolio Tracker" },
          timestamp: new Date().toISOString(),
        }]
      })
    });
  })();
</script>
</script>
</body>
</html>
